<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/telcoforge.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="TelcoForge — cockpit de pré-vendas e observabilidade da Logicalis." />
    <title>TelcoForge</title>
    <script>
      // Evita flash de tema: aplica a preferência salva antes da pintura.
      try {
        var t = localStorage.getItem('telcoforge-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
